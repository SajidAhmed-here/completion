name: Completion CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.toxenv }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toxenv:
          - py312-django52-drf314
          - py312-django52-drflatest
          - quality
          - docs

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TOXENV: ${{ matrix.toxenv }}
      # pytest and the quality/docs tox environments also declare this setting.
      DJANGO_SETTINGS_MODULE: completion.settings.test_settings

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            requirements/*.in
            setup.py
            tox.ini

      - name: Install pinned packaging tools
        run: python -m pip install -r requirements/pip.txt

      - name: Install pinned CI dependencies
        run: python -m pip install -r requirements/ci.txt

      - name: Check CI dependency compatibility
        run: python -m pip check

      # tox installs the package and the dependencies for each selected environment.
      # Tests use SQLite and the committed test settings; no custom secrets are needed.
      - name: Run tox checks
        run: python -m tox
